name: 週次記事自動生成・公開

on:
  schedule:
    # 毎週月曜 06:00 JST (= 日曜 21:00 UTC)
    - cron: "0 21 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージのインストール
        run: pip install -r automation/requirements.txt

      - name: 記事を自動生成(Claude API)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 automation/generate_article.py

      - name: サイトをビルド
        run: python3 build.py

      - name: 変更をコミット・push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更がないため、コミットをスキップします。"
          else
            git commit -m "自動生成: 週次記事の追加 ($(date -u +%Y-%m-%d))"
            git push
          fi
